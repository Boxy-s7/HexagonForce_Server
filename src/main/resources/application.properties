# H2 datasource used by the application.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:./data/server

# Apply schema changes from Liquibase when the application starts.
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.liquibase.migrate-at-start=true

# Liquibase owns schema creation; Hibernate checks mappings against it.
quarkus.hibernate-orm.schema-management.strategy=validate
