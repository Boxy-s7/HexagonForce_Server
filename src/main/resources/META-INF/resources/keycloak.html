<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Login</title>
<body>
  <p id="status">Keycloak-Login wird vorbereitet …</p>

<script>
const issuer = "http://localhost:8180/realms/hexagonforce";
const clientId = "DEINE_UNITY_CLIENT_ID";
const redirectUri = "http://localhost:808/keycloak-callback.html";
const unityCallback = "mygame://auth";

const status = document.getElementById("status");
const base64url = bytes =>
  btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replaceAll("+", "-").replaceAll("/", "_").replaceAll("=", "");

async function sha256(value) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
}

function decodeJwtPayload(jwt) {
  const part = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  return JSON.parse(atob(part));
}

async function startLogin() {
  const params = new URLSearchParams(location.search);
  const code = params.get("code");

  // Rückkehr von Keycloak: Authorization Code gegen Tokens tauschen
  if (code) {
    const expectedState = sessionStorage.getItem("oidc_state");
    if (!expectedState || params.get("state") !== expectedState) {
      throw new Error("Ungültiger OAuth state");
    }

    const verifier = sessionStorage.getItem("pkce_verifier");
    const response = await fetch(`${issuer}/protocol/openid-connect/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: clientId,
        code,
        redirect_uri: redirectUri,
        code_verifier: verifier
      })
    });

    if (!response.ok) throw new Error("Token-Austausch mit Keycloak fehlgeschlagen");

    const tokens = await response.json();
    const userId = decodeJwtPayload(tokens.id_token).sub;

    status.textContent = "Login erfolgreich. Unity wird geöffnet …";

    // Unity muss mygame://auth abfangen und access_token/user_id auslesen.
    location.href = `${unityCallback}?access_token=${
      encodeURIComponent(tokens.access_token)
    }&user_id=${encodeURIComponent(userId)}`;
    return;
  }

  // Erster Aufruf: PKCE-Daten erzeugen und Keycloak öffnen
  const verifier = base64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = base64url(await sha256(verifier));
  const state = base64url(crypto.getRandomValues(new Uint8Array(32)));

  sessionStorage.setItem("pkce_verifier", verifier);
  sessionStorage.setItem("oidc_state", state);

  const authUrl = new URL(`${issuer}/protocol/openid-connect/auth`);
  authUrl.search = new URLSearchParams({
    client_id: clientId,
    response_type: "code",
    scope: "openid profile email",
    redirect_uri: redirectUri,
    code_challenge: challenge,
    code_challenge_method: "S256",
    state
  });

  location.href = authUrl;
}

startLogin().catch(error => {
  console.error(error);
  status.textContent = `Login-Fehler: ${error.message}`;
});
</script>
</body>
</html>
