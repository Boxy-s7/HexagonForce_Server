                  type: VARCHAR(255)
              - column:
                  name: c_0
                  type: UUID
              - column:
                  name: p_0
                  type: UUID
              - column:
                  name: p_1
                  type: UUID
              - column:
                  name: p_2
                  type: UUID
              - column:
                  name: p_3
                  type: UUID
              - column:
                  name: p_4
                  type: UUID
              - column:
                  name: p_5
                  type: UUID

        - createTable:
