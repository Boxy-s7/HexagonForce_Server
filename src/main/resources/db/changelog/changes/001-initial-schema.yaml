databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: hexagonforce
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_user
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_app_user_username

        - createTable:
            tableName: user_session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_session
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: login_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: logout_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_command
                  type: INTEGER
              - column:
                  name: last_message
                  type: INTEGER
              - column:
                  name: open_connections
                  type: INTEGER

        - addForeignKeyConstraint:
            baseTableName: user_session
            baseColumnNames: user_id
            constraintName: fk_user_session_user
            referencedTableName: app_user
            referencedColumnNames: id

        - createIndex:
            tableName: user_session
            indexName: idx_user_session_user_id
            columns:
              - column:
                  name: user_id

        - createTable:
            tableName: user_devices
            columns:
              - column:
                  name: device_token
                  type: VARCHAR(2048)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_devices
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_devices
            baseColumnNames: user_id
            constraintName: fk_user_devices_user
            referencedTableName: app_user
            referencedColumnNames: id

        - createIndex:
            tableName: user_devices
            indexName: idx_user_devices_user_id
            columns:
              - column:
                  name: user_id

        - createTable:
            tableName: world_mega_cluster
            columns:
