databaseChangeLog:
  - changeSet:
      id: 001-create-user-and-session
      author: hexagonforce
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_user
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_app_user_username

        - createTable:
            tableName: user_session
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_session
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: login_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: logout_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: user_session
            baseColumnNames: user_id
            constraintName: fk_user_session_user
            referencedTableName: app_user
            referencedColumnNames: id

        - createIndex:
            tableName: user_session
            indexName: idx_user_session_user_id
            columns:
              - column:
                  name: user_id
